name: Build TalkBack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK
        run: echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build TalkBack
        run: ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talkback-apk
          path: "**/*.apk"
          if-no-files-found: error
