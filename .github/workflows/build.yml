name: Android CI for TalkBack

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with build.sh
      env:
        ANDROID_SDK: ${{ env.ANDROID_HOME }}
        GRADLE_DEBUG: --debug
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: talkback-apks
        path: '**/*.apk'
